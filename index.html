<title>TANK — la review de mains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* charte inspirée de GTO Wizard : fond sombre neutre, accent cyan,
     et surtout le code couleur des actions — rouge agression, vert passif,
     ardoise pour le fold. */
  --bg:#0A0D11; --panel:#161D26; --panel2:#232C38; --line:#333E4C; --line2:#465364;
  --card:#232E3B; --card2:#151C25; --cardline:#465363;
  --tabbg:#1B1233; --tabline:#332659; --tabmut:#9A8FC4;
  --shadow:0 8px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05);
  --text:#F1F4F7; --muted:#8D99A8; --dim:#5C6775;
  /* couleurs d'action pleines et saturées : c'est la signature.
     rouge agression, vert passif, bleu fold — la convention des solveurs. */
  --raise:#F5453F; --raise-d:#3B1614; --raise-i:#2A0A08;
  --call:#22C55E;  --call-d:#0F3520;  --call-i:#062012;
  --fold:#3D7BE0;  --fold-d:#132A4C;  --fold-i:#07142A;
  --cyan:#00D8C8; --cyan-d:#00887F; --cyan-i:#04211F;
  --win:#22C55E; --lose:#F5453F;
  /* deux rôles typographiques : Plus Jakarta Sans porte la marque, les actions
     et le texte (la géométrique ronde demandée), IBM Plex Mono les nombres. */
  --fd:'Plus Jakarta Sans','Inter',sans-serif;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
/* Mode clair : mêmes rôles, palette inversée. Les couleurs d'action sont
   assombries d'un cran pour tenir le contraste sur blanc ; leurs fonds -d/-i
   deviennent des teintes pastel. */
body.light{
  --bg:#E9EDF2; --panel:#FFFFFF; --panel2:#DFE5EC; --line:#CBD3DD; --line2:#B4BFCC;
  --card:#FFFFFF; --card2:#F2F5F9; --cardline:#CBD4DF;
  --tabbg:#241947; --tabline:#3A2B66; --tabmut:#B4A9DD;
  --shadow:0 8px 20px rgba(15,25,40,.12), inset 0 1px 0 rgba(255,255,255,.9);
  --text:#151B23; --muted:#5A6675; --dim:#8A94A3;
  --raise:#D93A34; --raise-d:#F6D9D7; --raise-i:#FBEBEA;
  --call:#189A4A;  --call-d:#D3EEDD;  --call-i:#E9F7EF;
  --fold:#2F66C4;  --fold-d:#D9E4F7;  --fold-i:#ECF2FB;
  --cyan:#009486; --cyan-d:#BFE9E4; --cyan-i:#E2F5F3;
  --win:#189A4A; --lose:#D93A34;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:contain}
button,input[type=range]{touch-action:manipulation}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased}
#app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
button{font-family:var(--font)}

.hdr{display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);
  min-height:48px;background:var(--bg);position:sticky;top:0;z-index:20}
.hdr .sect{font-size:13.5px;color:var(--muted);font-weight:500;padding-left:10px;
  border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbrand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;
  color:var(--text);font:inherit}
.btn.oauth{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px}
.btn.play{display:block;width:100%;margin:0 0 14px;padding:13px;font-family:var(--fd);
  font-size:14px;font-weight:800;letter-spacing:.08em;color:#04211F;
  background:var(--cyan);border-color:var(--cyan);border-radius:10px}
.btn.play:active{opacity:.85}
.orsep{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--dim);
  font-family:var(--fd);font-size:10.5px;letter-spacing:.1em;font-weight:700}
.orsep::before,.orsep::after{content:'';flex:1;height:1px;background:var(--line)}
.hbrand:active{opacity:.75}
.mk{width:48px;height:26px;flex:0 0 auto;display:block}
.wm{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:.22em;line-height:1;
  color:var(--text)}
.wm i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);
  margin-left:3px;vertical-align:middle}
.hdr .sup{font-family:var(--fm);font-size:12px;color:var(--muted);margin-left:auto}
.ib{width:40px;height:40px;border-radius:5px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.body{flex:1;overflow-y:auto;padding:12px 13px 58px}
.foot{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.tabs{display:flex;border-top:1px solid var(--tabline);background:var(--tabbg);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;border-top:2px solid transparent;color:var(--tabmut);
  padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.1em;margin-top:-1px}
.tab .ic{font-size:16px;line-height:1}
.tab.on{color:#FFFFFF;border-top-color:var(--cyan);background:rgba(255,255,255,.07)}
.tab.on .ic{color:var(--cyan)}
.tabs{overflow:visible;position:relative;z-index:40}
.tab.add{overflow:visible}
.tab.add .ic{display:flex;align-items:center;justify-content:center;
  width:54px;height:54px;margin:-30px auto 3px;border-radius:50%;
  background:linear-gradient(160deg,#00E5D4,#00A99B);color:#04211F;
  border:4px solid var(--tabbg);
  box-shadow:0 6px 18px rgba(0,216,200,.45)}
.tab.add .ic svg{display:block}
.tab.add{color:var(--cyan)}
.tab.add.on .ic{background:linear-gradient(160deg,#00E5D4,#00A99B);color:#04211F}

.lbl{font-family:var(--fd);font-size:12px;color:var(--muted);letter-spacing:.1em;
  font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.lbl::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--cyan);flex:0 0 auto}
.field{margin-bottom:15px}
.sub{font-size:13px;color:var(--muted);margin-bottom:15px}
.rowbar{display:flex;gap:0;margin-bottom:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:3px}
.seg{flex:1;background:none;border:none;color:var(--muted);border-radius:4px;padding:11px 4px;
  font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.02em;cursor:pointer}
.seg.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:5px;
  padding:9px 12px;font-size:14px;font-weight:500;cursor:pointer;min-height:40px}
.chip.on{background:var(--cyan);color:var(--cyan-i);border-color:var(--cyan);font-weight:700}
.chip:disabled{opacity:.3}
.chip.rsn{font-size:12.5px;padding:7px 10px;min-height:34px}

/* cartes */
.card{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;
  background:#EEF1F4;color:#14181D;border-radius:3px;font-weight:700;letter-spacing:-.03em;
  line-height:1;border:1px solid rgba(0,0,0,.3)}
.card .su{font-size:.8em;margin-top:1px}
.card.s-s{color:#14181D} .card.s-h{color:#D63C36} .card.s-d{color:#2C7BD1} .card.s-c{color:#1F8A52}
.card.back{background:
   repeating-linear-gradient(135deg,#C8332D 0 3px,#A5221D 3px 6px);
  border:1.5px solid #F4E9E1;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.card.empty{background:none;border:1px dashed var(--line)}
.c-xxs{width:24px;height:33px;font-size:12.5px}
.c-xs{width:30px;height:41px;font-size:15px}
.c-sm{width:34px;height:47px;font-size:17px}
.c-md{width:33px;height:45px;font-size:17px}

/* ---------- feuille de main (vue principale) ---------- */
.info{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:10px 12px;
  margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.info .k{font-size:10px;color:var(--dim);letter-spacing:.07em;font-weight:600;display:block}
.info .v{font-size:13.5px;font-weight:600}
.stbar{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.stbar .nm{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--cyan)}
.stbar .cards{display:flex;gap:3px;margin-left:2px}
.stbar .pot{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
.stbar .pot b{font-family:var(--fm);color:var(--text);font-weight:600}
.arow{display:flex;align-items:center;gap:11px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  font-size:13.5px}
.arow.hero{border-left-width:3px;border-left-color:var(--cyan);
  background:linear-gradient(90deg,var(--cyan-i),transparent 70%)}
.arow .slot{width:20px;flex:0 0 auto;display:flex;align-items:center}
.arow .slot .crn{width:16px;height:12.5px}
.arow .pos{font-family:var(--fd);width:46px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.arow.hero .pos{color:var(--cyan)}
.ap{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;
  border-radius:4px;min-width:66px;text-align:center}
.ap.fold{background:var(--fold);color:var(--fold-i)}
.ap.pass{background:var(--call);color:var(--call-i)}
.ap.agg{background:var(--raise);color:var(--raise-i)}
.arow .amt{font-family:var(--fm);font-size:13px;font-weight:600;margin-left:2px}
.arow .ai{font-size:10px;font-weight:700;color:var(--raise);letter-spacing:.06em;
  border:1px solid var(--raise-d);border-radius:3px;padding:1px 5px}
.why{margin:2px 0 8px 20px;padding:8px 11px;border-left:2px solid var(--cyan-d);background:var(--panel);
  border-radius:0 5px 5px 0;font-size:12.5px;color:var(--muted)}
.why b{color:var(--text);font-weight:600}
.why .tagline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.why .t{font-size:10.5px;font-weight:600;color:var(--cyan);background:rgba(23,190,187,.10);
  border:1px solid rgba(23,190,187,.25);border-radius:3px;padding:2px 6px}
.sdrow{display:flex;align-items:center;gap:9px;padding:7px 0 7px 9px;border-left:2px solid transparent;
  font-size:13.5px}
.sdrow.w{border-left-color:var(--call);background:linear-gradient(90deg,rgba(69,179,107,.08),transparent)}
.sdrow .pos{font-family:var(--fd);width:46px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.sdrow.w .pos{color:var(--call)}
.sdrow .cds{display:flex;gap:3px}
.sdrow .nc{font-size:12px;color:var(--dim)}
.sdrow .wb{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:3px;background:var(--call-d);color:var(--call)}
.res{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);padding:11px 12px;margin-top:16px}
.res .v{font-family:var(--fm);font-size:20px;font-weight:600;letter-spacing:-.02em}
.res .k{font-size:10.5px;color:var(--dim);letter-spacing:.07em;font-weight:600}

/* ---------- fiche main (listes) ---------- */
.hc{border:1px solid var(--cardline);border-radius:16px;
  background:linear-gradient(168deg,var(--card),var(--card2));
  box-shadow:var(--shadow);padding:16px 15px;
  margin-bottom:16px;cursor:pointer;display:block;width:100%;text-align:left;color:var(--text)}
.hc:active{border-color:var(--line2)}
.hc .top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  color:var(--muted);flex:0 0 auto}
.hc .who{font-family:var(--fd);font-size:15px;font-weight:700;font-style:italic;
  color:var(--text);letter-spacing:.01em}
.when{margin-left:12px}
.qplay{width:44px;height:44px;flex:0 0 auto;margin-left:auto;border-radius:50%;
  border:none;color:#EAFBF1;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding-left:3px;
  background:linear-gradient(160deg,#1CA85A,#0E6B35);
  box-shadow:0 4px 12px rgba(14,107,53,.45), inset 0 1px 0 rgba(255,255,255,.22)}
.qplay:active{transform:scale(.94)}
/* replay : la question du poseur, masquable d'un tap */
.rq{position:relative;background:var(--card2);border:1px solid var(--cardline);border-radius:10px;
  padding:10px 34px 10px 12px;font-size:13px;line-height:1.45;margin-bottom:8px}
.rq b{color:var(--cyan);font-style:italic}
.rq-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;background:none;
  color:var(--dim);font-size:13px;cursor:pointer}
.rq-o{display:block;width:100%;border:1px dashed var(--line2);background:none;color:var(--muted);
  border-radius:8px;padding:7px;font-size:11.5px;margin-bottom:8px;cursor:pointer}
/* profil : historique en lignes empilées */
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;cursor:pointer;
  background:var(--card2);border:1px solid var(--cardline);border-radius:9px;padding:8px 10px;
  color:var(--text);font:inherit}
.hrow .ht{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hrow .bdg{flex:0 0 auto}
.hrow .hd{flex:0 0 auto;font-size:10.5px;color:var(--dim)}
.mycmt{font-size:11.5px;color:var(--muted);font-style:italic;margin:-2px 0 2px 12px}
.privrow{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:12.5px;
  color:var(--muted);line-height:1.45;cursor:pointer}
.privrow input{width:18px;height:18px;accent-color:var(--cyan);margin-top:1px}
.hrow.priv{border-style:dashed;opacity:.85}
.plock{flex:0 0 auto;font-size:14px;padding:2px 3px;cursor:pointer}
.pdel{flex:0 0 auto;color:var(--raise);font-size:12px;font-weight:700;padding:4px 5px;cursor:pointer}
.soc{display:flex;gap:9px;margin-top:10px}
.socb{width:34px;height:34px;border-radius:9px;border:1px solid var(--cardline);
  background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.socb svg{width:18px;height:18px}
.socb:active{color:var(--cyan);border-color:var(--cyan)}
.stat.tap{background:none;border:none;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fgo{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;
  color:var(--text);font:inherit;cursor:pointer;text-align:left;min-width:0}
.fh{min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh i{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
.fdel{color:var(--raise);border-color:var(--raise-d);font-size:11px;flex:0 0 auto}
/* filtres compacts (Hot) */
.rowbar.mini .seg{padding:6px 3px;font-size:10.5px}
.rowbar.mini{margin-bottom:6px}
.chips.mini .chip{padding:5px 9px;font-size:11.5px;height:30px;min-height:30px}
.sitrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sitrow .sl{font-family:var(--fd);font-size:9px;font-weight:800;letter-spacing:.12em;
  color:var(--dim);flex:0 0 34px}
.sitrow .chips{flex:1;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;
  -ms-overflow-style:none;padding-bottom:0}
.sitrow .chips::-webkit-scrollbar{display:none}
.fcount{font-size:11.5px;color:var(--muted);margin:2px 2px 10px;
  font-family:var(--fd);letter-spacing:.03em}
.fcount b{color:var(--cyan);font-size:13px}
.hc .when{font-size:11.5px;color:var(--dim)}
.hc .line{display:flex;align-items:center;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.hc .sep{color:var(--dim);font-size:11px;margin:0 3px}
.hc .q{font-family:var(--fd);font-size:18px;font-weight:800;line-height:1.22;
  letter-spacing:-.01em;margin:2px 0 12px}
.hc .meta{display:flex;gap:9px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.hc .meta b{color:var(--text);font-weight:600}
.hcact{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.ra{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:8px 4px;color:var(--muted);
  font-family:var(--fd);font-size:11.5px;font-weight:700;letter-spacing:.05em;cursor:pointer}
.ra b{font-family:var(--fm);color:var(--text);font-weight:600}
.ra.like.on{background:var(--call);border-color:var(--call);color:var(--call-i)}
.ra.like.on b{color:var(--call-i)}
.ra.dis.on{background:var(--raise);border-color:var(--raise);color:var(--raise-i)}
.ra.dis.on b{color:var(--raise-i)}
.bdg{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:3px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.bdg.big{font-family:var(--fm);font-size:15px;font-weight:600;padding:5px 11px;border-radius:7px}
.bdg.win{color:var(--win);border-color:var(--call-d);background:var(--call-d)}
.bdg.lose{color:var(--lose);border-color:var(--raise-d);background:var(--raise-d)}
.bdg.cy{color:var(--cyan);border-color:rgba(23,190,187,.3);background:rgba(23,190,187,.08)}
.bdg.pt{font-family:var(--fd);font-weight:800;letter-spacing:.06em;color:var(--cyan);
  border-color:var(--cyan-d);background:var(--cyan-i)}

/* ---------- table (rejeu optionnel) ---------- */
.tw{position:relative;width:100%;height:390px;margin:2px 0 10px}
/* En saisie, la table partage l'écran avec sizings + actions : plus compacte,
   et encore un cran de moins sur les petits téléphones. Le replay garde 390px. */
.ent .tw{height:308px;margin:0 0 6px}
.ent .seat{width:76px}
.ent .potline{margin-top:6px}
@media (max-height:740px){ .ent .tw{height:272px} .ent .c-xs{width:26px;height:36px;font-size:13px} }
.felt{position:absolute;left:5%;right:5%;top:5%;bottom:5%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#2E9D63 0%,#1E7A47 48%,#125234 100%);
  border:9px solid #202B38;
  box-shadow:inset 0 0 60px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35)}
.felt::before{content:'';position:absolute;inset:11%;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.14)}
.centre{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;width:100%}
.tboard{display:flex;gap:4px;justify-content:center;min-height:45px;align-items:center}

.potline{margin-top:9px;font-family:var(--fd);font-size:13px;letter-spacing:.07em;font-weight:800;
  color:#DFF3E8;background:rgba(8,12,17,.72);border:1px solid rgba(255,255,255,.16);
  border-radius:16px;padding:5px 15px;display:inline-block}
.potline b{font-family:var(--fm);font-size:15px;font-weight:700;color:#FFFFFF;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.wmark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:74px;height:74px;
  pointer-events:none}.wmark svg{width:100%;height:100%}

.street{position:absolute;left:50%;top:26.5%;transform:translate(-50%,-50%);
  font-family:var(--fd);font-size:11px;font-weight:800;letter-spacing:.16em;color:#EAF4EE;
  background:rgba(8,12,17,.55);border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:4px 13px}
.seat{position:absolute;transform:translate(-50%,-50%);width:82px;text-align:center}
.seat .hand{display:flex;gap:2px;justify-content:center;height:auto;
  margin:-6px 0 5px;position:relative;z-index:1}
.seat .plate{background:rgba(13,19,26,.92);border:1px solid #33404E;border-radius:6px;
  padding:4px 6px 5px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.seat .nm{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.07em;color:#D7E0EA}
.seat .stk{font-family:var(--fm);font-size:13.5px;font-weight:700;line-height:1.2;color:#EDF4FA}
/* Le héros doit s'identifier en un quart de seconde : halo cyan autour de la
   plaque, fond teinté, étiquette TOI au-dessus des cartes. */
.seat.hero .plate{border-color:var(--cyan);
  background:linear-gradient(165deg,var(--cyan-i),var(--panel));
  box-shadow:0 0 0 1.5px var(--cyan),0 0 16px rgba(0,216,200,.35)}
.seat.hero .nm{color:var(--cyan);font-weight:800}
.youtag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.youtag .crn{width:19px;height:15px;display:block}
.seat.act .plate{background:#0D141C;border-color:#00D8C8;
  box-shadow:0 0 0 2px rgba(0,216,200,.45),0 0 14px rgba(0,216,200,.25)}
.seat.out{opacity:.3} .seat.out .plate{background:transparent}
.seat.skip{cursor:pointer}
.seat.skip .plate{border-style:dashed;border-color:var(--line2)}
.seat.skip:active .plate{border-color:var(--cyan)}
.seat.win .plate{border-color:var(--call);background:var(--call-d)}
.seat.win .nm{color:var(--call)}
.dbtn{position:absolute;width:18px;height:18px;border-radius:50%;background:#E4E8EC;color:#14181D;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%)}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;
  background:rgba(8,12,17,.85);border:1px solid rgba(255,255,255,.18);border-radius:20px;
  padding:2.5px 9px 2.5px 4px;font-family:var(--fm);font-size:11.5px;font-weight:600;color:#FFFFFF}
.bet i{width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FF7A6E,#C8332D 60%,#8E1712);
  border:2px dashed rgba(255,255,255,.85);box-sizing:border-box}
.tg{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:3px}
.tg.fold{background:var(--fold);color:var(--fold-i)}
.tg.pass{background:var(--call);color:var(--call-i)}
.tg.agg{background:var(--raise);color:var(--raise-i)}

/* ---------- barres ---------- */
.sizings{display:flex;gap:5px;margin-bottom:7px}
.sz{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:6px 1px;text-align:center;cursor:pointer}
.sz.on{background:var(--cyan);border-color:var(--cyan)}
.sz.on .p,.sz.on .b{color:var(--cyan-i)}
.sz .p{font-family:var(--fd);display:block;font-size:10px;color:var(--muted);font-weight:700}
.sz .b{font-family:var(--fm);display:block;font-size:13.5px;font-weight:600}
.wheel{display:flex;align-items:center;gap:10px;margin-bottom:7px;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 11px}
.wheel input[type=range]{flex:1;accent-color:var(--cyan);height:30px;background:none;
  -webkit-appearance:none;appearance:none}
.wheel input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
.wheel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:var(--cyan);border:3px solid var(--bg);margin-top:-11px}
.wheel input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
.wheel input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:var(--cyan);border:3px solid var(--bg)}
.wheel .wv{display:flex;flex-direction:column;align-items:flex-end;min-width:86px}
.wheel .wv span{font-family:var(--fd);font-size:9px;letter-spacing:.1em;color:var(--dim);font-weight:700}
.wheel .wv b{font-family:var(--fm);font-size:14px;font-weight:600}
.acts{display:flex;gap:6px}
.act{flex:1;height:56px;border:none;border-radius:6px;font-family:var(--fd);font-size:14.5px;
  font-weight:700;letter-spacing:.04em;cursor:pointer;background:var(--panel2);color:var(--text)}
.act.fold{background:var(--fold);color:var(--fold-i)}
.act.pass{background:var(--call);color:var(--call-i)}
.act.go{background:var(--raise);color:var(--raise-i)}
.act.cy{background:var(--cyan);color:var(--cyan-i)}
.act:disabled{opacity:.25}
.ctrl{display:flex;gap:6px}
.ctrl button{flex:1;height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:5px;font-size:14px;font-weight:600;cursor:pointer}
.ctrl button.wide{flex:2}
.ctrl button:disabled{opacity:.3}

/* ---------- divers ---------- */
.msg.err{border-color:var(--raise);color:var(--raise)}
.msg.okm{border-color:var(--call);color:var(--call)}
.msg{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  font-size:13px;color:var(--muted);margin-bottom:10px}
.msg b{color:var(--text);font-weight:600}
.empty{text-align:center;padding:34px 16px 26px}
.empty .big{font-size:17px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.stats{display:flex;gap:7px;margin:14px 0}
.stat{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--panel)}
.stat .v{font-family:var(--fm);font-size:17px;font-weight:600;letter-spacing:-.02em}
.stat .k{font-size:9.5px;color:var(--dim);letter-spacing:.06em;line-height:1.3;margin-top:3px;font-weight:600}
.prof{display:flex;gap:12px;align-items:center}
.av.lg{width:46px;height:46px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:5px;

<script>
/* ============================================================
   1. MOTEUR — pur, couvert par tests
   ============================================================ */
const RANKS=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const SUITS=[['s','\u2660'],['h','\u2665'],['d','\u2666'],['c','\u2663']];
const SEAT_ORDER={2:['SB','BB'],3:['SB','BB','BTN'],4:['SB','BB','CO','BTN'],
  5:['SB','BB','HJ','CO','BTN'],6:['SB','BB','UTG','HJ','CO','BTN'],
  7:['SB','BB','UTG','LJ','HJ','CO','BTN'],8:['SB','BB','UTG','UTG+1','LJ','HJ','CO','BTN'],
  9:['SB','BB','UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN']};
const STREETS=['preflop','flop','turn','river'];
const NEED={flop:3,turn:1,river:1};
const round2=v=>Math.round(v*100)/100;
const fmt=v=>(Math.round(v*10)/10).toString();

function newHand(cfg){
  const order=SEAT_ORDER[cfg.tableSize];
  const s={cfg,seats:order.map((pos,i)=>({pos,active:true,allIn:false,stack:cfg.stack,committed:0,
      total:0,hasActed:false,hero:i===cfg.heroSeat,cards:i===cfg.heroSeat?cfg.heroCards.slice():null})),
    street:'preflop',board:[],actions:[],potClosed:0,currentBet:0,minRaise:1,toAct:null,
    over:false,endReason:null};
  s.potClosed=cfg.ante*cfg.tableSize;
  commitTo(s,0,0.5);
  if(cfg.tableSize>1) commitTo(s,1,1);
  s.currentBet=1; s.minRaise=1;
  s.toAct=cfg.tableSize===2?0:2;
  return s;
}
function commitTo(s,i,target){
  const p=s.seats[i], add=Math.min(Math.max(0,target-p.committed),p.stack);
  p.stack-=add; p.committed+=add; p.total+=add;
  if(p.stack<=0.0001){ p.stack=0; p.allIn=true; }
}
const pot=s=>s.potClosed+s.seats.reduce((a,p)=>a+p.committed,0);
const toCall=s=>{const p=s.seats[s.toAct];return Math.min(s.currentBet-p.committed,p.stack);};
const activeSeats=s=>s.seats.filter(p=>p.active);
const canActCount=s=>s.seats.filter(p=>p.active&&!p.allIn).length;
function legal(s){
  if(s.over||s.toAct===null||s.toAct<0) return {};
  const p=s.seats[s.toAct], c=toCall(s);
  return {fold:c>0,check:c===0,call:c>0,bet:s.currentBet===0&&p.stack>0,raise:s.currentBet>0&&p.stack>c};
}
function apply(s,type,amount){
  const i=s.toAct,p=s.seats[i];
  const rec={street:s.street,seat:i,pos:p.pos,type,potBefore:round2(pot(s)),
    note:'',reasons:[],notePrivate:false,hero:p.hero};
  if(type==='fold') p.active=false;
  else if(type==='check'){}
  else if(type==='call') commitTo(s,i,s.currentBet);
  else{
    const target=Math.min(amount,p.committed+p.stack), inc=target-s.currentBet;
    if(inc>=s.minRaise-0.0001) s.minRaise=inc;
    s.currentBet=Math.max(s.currentBet,target);
    commitTo(s,i,target);
  }
  p.hasActed=true;
  rec.amount=round2(p.committed); rec.allIn=p.allIn;
  s.actions.push(rec); advance(s); return rec;
}
function nextToAct(s){
  const n=s.seats.length;
  for(let k=1;k<=n;k++){
    const i=(s.toAct+k)%n,p=s.seats[i];
    if(p.active&&!p.allIn&&(!p.hasActed||p.committed<s.currentBet-0.0001)) return i;
  }
  return null;
}
function advance(s){
  if(activeSeats(s).length<=1){ closeStreet(s); return; }
  const nx=nextToAct(s);
  if(nx!==null){ s.toAct=nx; return; }
  closeStreet(s);
}
function closeStreet(s){
  s.potClosed=round2(pot(s));
  s.seats.forEach(p=>{p.committed=0;p.hasActed=false;});
  s.currentBet=0; s.minRaise=1;
  if(activeSeats(s).length<=1){ s.over=true;s.endReason='fold';s.toAct=null;return; }
  if(s.street==='river'){ s.over=true;s.endReason='showdown';s.toAct=null;return; }
  s.street=STREETS[STREETS.indexOf(s.street)+1];
  s.toAct=null;
}
function openStreet(s){
  if(canActCount(s)<=1){
    if(s.street==='river'){ s.over=true;s.endReason='showdown';return; }
    s.street=STREETS[STREETS.indexOf(s.street)+1];
    return;
  }
  // Postflop la parole ouvre à gauche du bouton : siège 0 (SB) en table pleine,
  // mais la BB en heads-up, où le SB EST le bouton.
  const start=s.seats.length===2?1:0, n=s.seats.length;
  for(let k=0;k<n;k++){
    const i=(start+k)%n;
    if(s.seats[i].active&&!s.seats[i].allIn){ s.toAct=i; return; }
  }
  s.toAct=null;
}
/* Passer la parole : l'utilisateur touche le prochain joueur qui agit vraiment,
   et chaque joueur intermédiaire prend l'action passive par défaut — fold s'il
   fait face à une mise, check sinon. Chaque action passe par apply(), donc le
   raccourci ne peut produire que des états légaux. */
function canSkipTo(s,i){
  const p=s.seats[i];
  return !s.over && s.toAct!==null && s.toAct>=0 && i!==s.toAct
    && p.active && !p.allIn
    && !(p.hasActed && p.committed>=s.currentBet-0.0001);  // déjà parlé, rien à ajouter
}
function skipCore(s,target){
  if(!canSkipTo(s,target)) return false;
  let guard=s.seats.length;
  while(s.toAct!==null && s.toAct!==target && !s.over && guard-->0){
    apply(s, toCall(s)>0 ? 'fold' : 'check');
  }
  return true;
}
function sidePots(s){
  const inv=s.seats.map((p,i)=>({i,t:p.total,active:p.active})).filter(x=>x.t>0);
  const levels=[...new Set(inv.map(x=>x.t))].sort((a,b)=>a-b);
  const out=[]; let prev=0;
  for(const L of levels){
    const cnt=inv.filter(x=>x.t>=L-0.0001).length, amt=round2((L-prev)*cnt);
    const elig=inv.filter(x=>x.t>=L-0.0001&&x.active).map(x=>s.seats[x.i].pos);
    if(amt>0) out.push({amount:amt,eligible:elig});
    prev=L;
  }
  return out;
}

/* ============================================================
   2. CLASSEMENTS — pur, testable
   ============================================================ */
/* Borne basse de Wilson : 3 likes sur 3 ne doit pas battre 180 sur 200. */
function wilson(pos,n){
  if(!n) return 0;
  const z=1.96,p=pos/n;
  return (p+z*z/(2*n)-z*Math.sqrt((p*(1-p)+z*z/(4*n))/n))/(1+z*z/n);
}
/* Controverse : entropie du partage like/dislike, pondérée par le volume.
   Une main à 60/55 est plus intéressante qu'une main à 3/2. */
function controversy(h){
  const n=h.likes+h.dislikes;
  if(n<3) return 0;
  const p=h.likes/n;
  if(p<=0||p>=1) return 0;
  const ent=-(p*Math.log2(p)+(1-p)*Math.log2(1-p));
  return ent*Math.log10(1+n);
}
/* Décroissance : fenêtre semaine seulement, demi-vie 72 h. */
function hotScore(h,now){
  return wilson(h.likes,h.likes+h.dislikes)*Math.pow(0.5,((now-h.createdAt)/36e5)/72);
}
const WINDOWS={semaine:7,mois:30,année:365};
/* Situation d'une main, dérivée des actions saisies — aucun champ en plus.
   potTypeOf : nb de relances préflop (0 limpé, 1 srp, 2 3bet, 3+ 4bet+).
   matchupOf : positions encore en jeu à la fin du préflop ; 'X vs Y' (héros
   d'abord), 'multiway' à 3+, 'préflop' si personne ne voit le flop. */
function potTypeOf(h){
  const n=h.actions.filter(a=>a.street==='preflop'&&(a.type==='raise'||a.type==='bet')).length;
  return n===0?'limpé':n===1?'srp':n===2?'3bet':'4bet+';
}
function heroPosOf(h){ const a=h.actions.find(a=>a.hero); return a?a.pos:null; }
function matchupOf(h){
  const last={};
  h.actions.filter(a=>a.street==='preflop').forEach(a=>{last[a.pos]=a.type;});
  const alive=Object.keys(last).filter(p=>last[p]!=='fold');
  if(alive.length===2){
    const hp=heroPosOf(h);
    const first=alive.includes(hp)?hp:alive[0];
    const other=alive.find(x=>x!==first);
    return first+' vs '+other;
  }
  return alive.length>2?'multiway':'préflop seul';
}
function situOK(h,f){
  if(f.pot!=='tous'&&potTypeOf(h)!==f.pot) return false;
  if(f.hero!=='tous'&&heroPosOf(h)!==f.hero) return false;
  if(f.vs!=='tous'){
    const mu=matchupOf(h);
    if(!mu.includes(' vs ')) return false;
    const [a,b]=mu.split(' vs ');
    const hp=heroPosOf(h);
    if((hp===a?b:a)!==f.vs) return false;
  }
  return true;
}
function ranked(hands,win,mode,now){
  const cut=now-WINDOWS[win]*864e5;
  const pool=hands.filter(h=>h.createdAt>=cut);
  const key=mode==='controversées'?controversy
    :mode==='commentées'?(h=>h.comments.length)
    :win==='semaine'?(h=>hotScore(h,now)):(h=>wilson(h.likes,h.likes+h.dislikes));
  return pool.map(h=>({h,k:key(h)})).sort((a,b)=>b.k-a.k||b.h.createdAt-a.h.createdAt).map(x=>x.h);
}

function build(id,author,cfg,script,meta){
  const s=newHand(cfg);
  script.forEach(st=>{
    if(st[0]==='board'){ s.board.push(...st[1]); openStreet(s); return; }
    const rec=apply(s,st[0],st[1]);
    if(st[2]) rec.reasons=st[2];
    if(st[3]) rec.note=st[3];
  });
  const invested=s.seats[cfg.heroSeat].total;
  const alive=s.seats.map((p,i)=>p.active?i:-1).filter(i=>i>=0);
  // Un showdown n'a pas de gagnant déductible : il doit être saisi.
  if(s.endReason==='showdown'&&!meta.winners) throw new Error(id+' : showdown sans gagnant');
  const winners=s.endReason==='fold'?alive:meta.winners;
  const won=winners.includes(cfg.heroSeat);
  const share=round2(s.potClosed/winners.length);
  DB.hands.push({id,author,cfg,board:s.board.slice(),actions:s.actions,potFinal:s.potClosed,
    endReason:s.endReason,invested:round2(invested),won,alive,winners,
    showdown:meta.showdown||null,
    result:round2(won?share-invested:-invested),question:meta.q,
    createdAt:NOW-meta.ago*DAY,likes:meta.likes||0,dislikes:meta.dislikes||0,
    comments:meta.comments||[],tags:meta.tags||[]});
}

      get:k=>{try{const v=localStorage.getItem('tank.'+k);return v?JSON.parse(v):null}catch(e){return null}},

      del:k=>{try{localStorage.removeItem('tank.'+k)}catch(e){}}};

/* Titre par défaut, fabriqué depuis la main : cartes, position, type de pot.
   L'auteur écrit son titre s'il veut ; personne n'est bloqué par un champ vide. */
function autoTitle(cfg,actions,board){
  const c=cfg.heroCards;
  const cards=c[0][0]+c[1][0]+(c[0][0]===c[1][0]?'':(c[0][1]===c[1][1]?'s':'o'));
  const pos=SEAT_ORDER[cfg.tableSize][cfg.heroSeat];
  const pre=actions.filter(a=>a.street==='preflop'&&a.type==='raise').length;
  const potType=pre>=3?'pot 4bet':pre===2?'pot 3bet':pre===1?'pot relancé':'pot limpé';
  const street=board.length>=5?'à la river':board.length===4?'au turn'
    :board.length===3?'au flop':'préflop';
  return (cards+' en '+pos+' \u2014 '+potType+', '+street
    +(cfg.stakes?' \u00b7 '+cfg.stakes:'')).slice(0,140);
}

/* Tags générés depuis la main elle-même : type de pot, squeeze, overbet,
   tapis préflop, HU, format. Zéro saisie, et ils rendent le filtre par spot
   possible dès la première main publiée. */
function autoTags(cfg,actions,board){
  const t=[];
  const preR=actions.filter(a=>a.street==='preflop'&&a.type==='raise').length;
  if(preR===2) t.push('3bet pot'); else if(preR>=3) t.push('4bet pot');
  let seenR=false,seenC=false;
  for(const a of actions){
    if(a.street!=='preflop') break;
    if(a.type==='raise'){ if(seenR&&seenC){ t.push('squeeze'); break; } seenR=true; }
    else if(a.type==='call'&&seenR) seenC=true;
  }
  if(actions.some(a=>a.street!=='preflop'&&a.type==='bet'&&a.amount>a.potBefore+0.0001))
    t.push('overbet');
  if(actions.some(a=>a.allIn&&a.street==='preflop')) t.push('tapis préflop');
  if(cfg.tableSize===2) t.push('HU');
  if(cfg.format==='mtt') t.push('tournoi');
  if((cfg.stakes||'').toLowerCase().startsWith('live')) t.push('live');
  return [...new Set(t)].slice(0,4);
}

async function doOAuth(provider){
  auth.err='';
  if(provider==='google'&&GOOGLE_CLIENT_ID&&window.isSecureContext){
    try{
      // Flux Google Identity Services : popup depuis NOTRE page. L'écran de
      // consentement affiche le nom de l'app et notre domaine — jamais
      // l'URL Supabase. Nonce : brut pour Supabase, haché pour Google.
      const raw=(crypto.randomUUID()+crypto.randomUUID()).replace(/-/g,'');
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
      const hashed=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
      await new Promise((res,rej)=>{
        if(window.google&&google.accounts) return res();
        const sc=document.createElement('script');
        sc.src='https://accounts.google.com/gsi/client';
        sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);
      });
      google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,nonce:hashed,
        use_fedcm_for_prompt:true,
        callback:async resp=>{
          const r=await sb.auth.signInWithIdToken({provider:'google',
            token:resp.credential,nonce:raw});
          if(r.error){ auth.err=r.error.message; render(); }
        }});
      google.accounts.id.prompt(n=>{
        // popup indisponible (bloqué, FedCM refusé…) : repli redirect
        if(n.isNotDisplayed&&n.isNotDisplayed()||n.isSkippedMoment&&n.isSkippedMoment())
          oauthRedirect(provider);
      });
      return;
    }catch(e){ /* GIS injoignable : repli redirect */ }
  }
  oauthRedirect(provider);
}
async function oauthRedirect(provider){
  const r=await sb.auth.signInWithOAuth({provider,
    options:{redirectTo:(location.origin+location.pathname)}});
  if(r.error){ auth.err='Connexion '+provider+' indisponible : '+r.error.message; render(); }
}
async function doAuth(){
  const em=($('a-em').value||'').trim();
  auth.err=''; auth.info='';
  if(!/.+@.+\..+/.test(em)){ auth.err='Email invalide.'; render(); return; }
  auth.busy=true; render();
  // signInWithOtp : connexion ET création silencieuse du compte au premier lien.
  // Le pseudo n'intervient pas ici — dérivé par la base, modifiable au profil.
  const r=await sb.auth.signInWithOtp({email:em,
    options:{emailRedirectTo:(location.origin+location.pathname)}});
  auth.busy=false;
  if(r.error){ auth.err=r.error.message; render(); return; }
  auth.info='Lien envoyé à '+em+'. Ouvre-le depuis ce téléphone \u2014 tu reviendras ici connecté.';
  render();
}

function myEvents(){
  if(!DB.me) return [];
  const ev=[];
  DB.hands.filter(h=>h.author===DB.me).forEach(h=>{
    h.comments.forEach(c=>{ if(c.by!==DB.me)
      ev.push({kind:'comment',hand:h,by:c.by,at:c.at||h.createdAt,body:c.t,street:c.street}); });
    (h.rawReactions||[]).forEach(r=>{ if(r.by!==DB.me)
      ev.push({kind:r.kind,hand:h,by:r.by,at:r.at}); });
  });
  return ev.sort((a,b)=>b.at-a.at);

function getHand(id){ return DB.hands.find(h=>h.id===id); }
/* Reconstruit les pots street par street en rejouant le moteur : la feuille
   affichée ne peut pas diverger de la saisie. */
function streetPots(H){
  const s=newHand(H.cfg), out={preflop:1.5+H.cfg.ante*H.cfg.tableSize};
  let i=0;
  while(i<H.actions.length){
    while(s.toAct===null&&!s.over&&s.board.length<H.board.length){
      const need=NEED[s.street], st=s.street==='flop'?0:s.street==='turn'?3:4;
      s.board.push(...H.board.slice(st,st+need)); openStreet(s);
      out[s.street]=s.potClosed;
    }
    if(s.over) break;
    apply(s,H.actions[i].type,H.actions[i].amount); i++;
  }
  return out;
}

/* Le showdown est la conclusion de la main : sans lui, une main gagnée et une
   main perdue se lisent pareil. */
function showdownHTML(H){
  const order=SEAT_ORDER[H.cfg.tableSize];
  if(H.endReason!=='showdown'){
    const w=H.winners[0];
    return '<div class="stbar"><span class="nm">FIN DE LA MAIN</span>'
      +'<span class="pot">sans showdown</span></div>'
      +'<div class="sdrow w"><span class="pos">'+order[w]+'</span>'
      +'<span>remporte le pot, personne ne montre</span>'
      +'<span class="wb">+'+fmt(H.potFinal)+' BB</span></div>';
  }
  let h='<div class="stbar"><span class="nm">SHOWDOWN</span>'
    +'<span class="pot">pot <b>'+fmt(H.potFinal)+'</b> bb</span></div>';
  H.alive.forEach(i=>{
    const win=H.winners.includes(i);
    const cds=i===H.cfg.heroSeat?H.cfg.heroCards:(H.showdown&&H.showdown[i]);
    h+='<div class="sdrow'+(win?' w':'')+'"><span class="pos">'+order[i]+'</span>'
      +(cds?'<span class="cds">'+cds.map(c=>card(c,'c-sm')).join('')+'</span>'
           :'<span class="nc">cartes non montrées</span>')
      +(win?'<span class="wb">GAGNE '+fmt(round2(H.potFinal/H.winners.length))+' BB</span>':'')
      +'</div>';
  });
  return h;
}
function react(H,k){
  if(LIVE&&!DB.me){ go('auth'); return; }
  const cur=MY.liked[H.id];
  if(cur==='like') H.likes--;
  if(cur==='dislike') H.dislikes--;
  if(cur===k){ delete MY.liked[H.id]; }
  else { MY.liked[H.id]=k; if(k==='like') H.likes++; else H.dislikes++; }
  persistDemo();
  if(LIVE&&DB.me){
    const now=MY.liked[H.id];
    (now ? sb.from('reactions').upsert({hand_id:H.id,profile_id:DB.me,kind:now})
         : sb.from('reactions').delete().match({hand_id:H.id,profile_id:DB.me})
    ).then(r=>{ if(r.error) console.error(r.error); });
  }
}

/* ---------- rejeu pas à pas (secondaire, sans vote) ---------- */
function seatXY(i,n,hero,rx,ry){
  const off=((i-hero)%n+n)%n, ang=(90+off*360/n)*Math.PI/180;
  return {x:50+rx*Math.cos(ang),y:50+ry*Math.sin(ang)};
}
function tableHTML(s,lastBySeat,toActIdx,reveal,winners){
  const n=s.seats.length, hs=s.cfg.heroSeat;
  let h='<div class="tw"><div class="felt"></div>';
  h+='<div class="street">'+(s.over?'FIN DE LA MAIN':s.street.toUpperCase())+'</div>';
  h+='<div class="centre"><div class="tboard">';
  h+=s.board.length?s.board.map(c=>card(c,'c-md')).join('')
    :'<div style="color:var(--dim);font-size:12px;letter-spacing:.1em">\u2014</div>';
  h+='</div><div class="potline">POT <b>'+fmt(pot(s))+'</b> bb</div></div>'
   +'<div class="wmark"><svg viewBox="0 0 24 24"><path d="'
   +'M12 1 c-3.2 4.4 -7.6 7.6 -7.6 12 c0 2.9 2.3 5.2 5.2 5.2 c.8 0 1.55 -.18 2.2 -.5 l-2 6.3 h4.4 l-2 -6.3 c.65 .32 1.4 .5 2.2 .5 c2.9 0 5.2 -2.3 5.2 -5.2 c0 -4.4 -4.4 -7.6 -7.6 -12 z'
   +'" fill="rgba(255,255,255,.07)"/></svg></div>';
  s.seats.forEach((p,i)=>{
    const q=seatXY(i,n,hs,43,40);
    const shown=p.hero&&p.cards?p.cards:(reveal&&reveal[i])?reveal[i]:null;
    h+='<div class="seat'+(p.hero?' hero':'')+(i===toActIdx?' act':'')+(p.active?'':' out')
      +((winners&&winners.includes(i))?' win':'')
      +'" data-i="'+i+'" style="left:'+q.x+'%;top:'+q.y+'%"><div class="hand">'
      +(shown?shown.map(c=>card(c,'c-sm')).join(''):p.active?back_('c-xs')+back_('c-xs'):'')
      +'</div>'+(p.hero?'<div class="youtag">'+CROWN+'</div>':'')
      +'<div class="plate"><div class="nm">'+p.pos+'</div>'
      +'<div class="stk">'+(p.allIn?'TAPIS':fmt(p.stack))+'</div></div></div>';
    if(p.pos==='BTN'||(n===2&&i===0)){
      const d=seatXY(i,n,hs,29,27);
      h+='<div class="dbtn" style="left:'+d.x+'%;top:'+d.y+'%">D</div>';
    }
    if(p.committed>0){
      const b=seatXY(i,n,hs,25,23);
      h+='<div class="bet" style="left:'+b.x+'%;top:'+b.y+'%"><i></i>'+fmt(p.committed)+'</div>';
    }
    const la=lastBySeat[i];
    if(la&&!p.committed){
      const t=seatXY(i,n,hs,27,25);
      h+='<div class="tg '+aclass(la.type)+'" style="left:'+t.x+'%;top:'+t.y+'%">'+alabel(la.type)+'</div>';
    }
  });
  return h+'</div>';
}
function lastBySeatFrom(actions,street){
  const m={}; actions.filter(a=>a.street===street).forEach(a=>{m[a.seat]=a;}); return m;
}
function stateAt(H,k){
  const s=newHand(H.cfg);
  for(let i=0;i<k;i++){
    while(s.toAct===null&&!s.over) dealNext(H,s);
    if(s.over) break;
    apply(s,H.actions[i].type,H.actions[i].amount);
  }
  while(s.toAct===null&&!s.over&&s.board.length<H.board.length) dealNext(H,s);
  return s;
}
function dealNext(H,s){
  const need=NEED[s.street], st=s.street==='flop'?0:s.street==='turn'?3:4;
  const cs=H.board.slice(st,st+need);
  if(cs.length<need){ s.toAct=-1; return; }
  s.board.push(...cs); openStreet(s);
}
function viewReplay(id){
  const H=getHand(id);
  header('Replay \u00b7 '+Math.min(rp.k,H.actions.length)+'/'+H.actions.length,{back:true});
  const s=stateAt(H,rp.k);
  const last=H.actions[rp.k-1];
  const done=rp.k>=H.actions.length;
  body.innerHTML=(rp.showQ&&H.question
     ?'<div class="rq"><b>@'+player(H.author).handle+'</b> '+H.question
      +'<button class="rq-x" id="rq-x" aria-label="masquer">\u2715</button></div>'
     :'<button class="rq-o" id="rq-o">\u25be voir la question du joueur</button>')
   +tableHTML(s,lastBySeatFrom(H.actions.slice(0,rp.k),s.street),
      s.toAct===-1?null:s.toAct, done?H.showdown:null, done?H.winners:null)
   +(done?showdownHTML(H):'')
   +(last?'<div class="arow'+(last.hero?' hero':'')+'"><span class="pos">'+last.pos+'</span>'
      +'<span class="ap '+aclass(last.type)+'">'+alabel(last.type)+'</span>'
      +(last.type==='bet'||last.type==='raise'?'<span class="amt">'+fmt(last.amount)+' bb</span>':'')+'</div>'
     :'<div class="msg">Appuie sur lecture pour dérouler la main.</div>')
   +(last&&last.hero&&!last.notePrivate&&(last.reasons.length||last.note)
     ?'<div class="why">'+(last.reasons.length?'<div class="tagline">'

  Object.values(resDraft.cards||{}).forEach(cs=>u.push(...cs));

function pickCards(n,title,cb,minN){
  const used=usedCards(), sel=[], variable=minN!==undefined&&minN<n;
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML='<div class="sheet"><h2>'+title+'</h2><div class="grid" id="pg"></div>'
    +(variable?'<div class="acts" style="margin-top:10px">'
      +'<button class="act" id="pk-done">TERMINER</button></div>':'');
  document.body.appendChild(mask);
  const g=mask.querySelector('#pg');
  const done=()=>{ mask.remove(); cb(sel); };
  if(variable) mask.querySelector('#pk-done').onclick=done;
  SUITS.forEach(([su,sym])=>RANKS.forEach(r=>{
    const c=r+su, b=document.createElement('button');
    b.className='pk s-'+su; b.textContent=r+sym; b.disabled=used.includes(c);

/* Trois régimes de sizing, chacun dans son langage natif — toujours affiché en bb :
   · préflop, pot non ouvert : ouvertures en bb (2 / 2.3 / 2.5 / 3, réf. GTO Wizard)
   · préflop, face à relance : multiples de la relance (3-bet ~3-4x, 4-bet ~2.2-2.5x)
   · postflop : pourcentage du pot (25/33/50/75/POT + overbet)
   Plus la molette : un curseur pour tout sizing hors gamme, en bb. */
const PCT=[[25,'25%'],[33,'33%'],[50,'50%'],[75,'75%'],[100,'POT'],[150,'OVB']];
function sizingOptions(s){
  const lg=legal(s); if(!(lg.bet||lg.raise)) return null;
  const p=s.seats[s.toAct], P=pot(s), c=lg.raise?toCall(s):0;
  const max=round2(p.committed+p.stack);
  const minTo=lg.bet?Math.min(1,max):Math.min(round2(s.currentBet+s.minRaise),max);
  let mode,opts;
  if(s.street==='preflop'){
    const nR=s.actions.filter(a=>a.street==='preflop'&&a.type==='raise').length;
    if(nR===0){
      mode='open';
      const set=s.cfg.format==='mtt'?[2,2.2,2.5,3]:[2,2.3,2.5,3];
      opts=set.map(v=>({l:v+'bb',v:round2(v)}));
    }else if(nR===1){
      mode='3bet';
      opts=[3,3.5,4,5].map(k=>({l:k+'x',v:round2(s.currentBet*k)}));
    }else{
      mode='4bet';
      opts=[2.2,2.5,3].map(k=>({l:k+'x',v:round2(s.currentBet*k)}));
    }
  }else{
    mode=lg.bet?'bet':'raise';
    opts=PCT.map(([k,l])=>({l,
      v: lg.bet?round2(P*k/100):round2(p.committed+c+(P+c)*k/100)}));
  }
  opts=opts.map(o=>({l:o.l,v:Math.min(Math.max(o.v,minTo),max)}));
  const seen=new Set(), out=[];
  opts.forEach(o=>{ if(!seen.has(o.v)){ seen.add(o.v); out.push(o); } });
  if(!seen.has(max)) out.push({l:'TAPIS',v:max});
  else out[out.length-1].l='TAPIS';
  return {mode,opts:out,minTo,max,P,c,committed:p.committed,isBet:!!lg.bet,
          preflop:s.street==='preflop'};
}
function sizingsHTML(){
  const so=sizingOptions(S); if(!so) return '';
  const chips='<div class="sizings">'+so.opts.map((o,i)=>
    '<button class="sz'+(pendingSize===i?' on':'')+'" data-i="'+i+'" data-v="'+o.v+'">'
    +'<span class="p">'+o.l+'</span><span class="b">'+fmt(o.v)+'</span></button>').join('')+'</div>';
  /* la molette : bb au préflop, % du pot après */
  const wheel=so.preflop
    ? '<div class="wheel"><input type="range" id="wh" min="'+so.minTo+'" max="'+so.max
      +'" step="0.1" value="'+(pendingAmt||so.minTo)+'" data-kind="bb">'
      +'<div class="wv"><span>MOLETTE</span><b id="whv">'+(pendingSize===null&&pendingAmt?fmt(pendingAmt)+' bb':'\u2014')+'</b></div></div>'
    : '<div class="wheel"><input type="range" id="wh" min="10" max="250" step="5" value="66" data-kind="pct">'
      +'<div class="wv"><span>MOLETTE \u00b7 % POT</span><b id="whv">'+(pendingSize===null&&pendingAmt?fmt(pendingAmt)+' bb':'\u2014')+'</b></div></div>';
  return chips+wheel;
}
function wheelValue(so,raw){
  if(so.preflop) return Math.min(Math.max(round2(raw),so.minTo),so.max);
  const v=so.isBet?so.P*raw/100:so.committed+so.c+(so.P+so.c)*raw/100;
  return Math.min(Math.max(round2(v),so.minTo),so.max);
}
function actionsHTML(){
  const lg=legal(S), c=toCall(S);
  const mid=lg.check?'<button class="act pass" data-a="check">CHECK</button>'
   :'<button class="act pass" data-a="call">CALL '+fmt(c)+'</button>';
  const agg=lg.bet?'<button class="act go" data-a="bet">MISER</button>'
   :lg.raise?'<button class="act go" data-a="raise">RELANCER</button>':'';
  return '<div class="acts">'
   +'<button class="act" id="ub" style="flex:0 0 52px;font-size:17px"'

   +'<textarea class="cbox" id="q" rows="2" maxlength="140" '
   +'placeholder="'+autoTitle(S.cfg,S.actions,S.board).replace(/"/g,'')+'">'+resDraft.q+'</textarea>'
   +'<div style="font-size:11.5px;color:var(--dim);margin-top:5px">Laisse vide pour utiliser '
   +'ce titre. Pose une question si tu veux des avis.</div></div>'
   +'<label class="privrow"><input type="checkbox" id="r-priv"'+(resDraft.priv?' checked':'')+'>'
   +'<span><b>\uD83D\uDD12 Main privée</b> \u2014 visible par toi seul, pour tes notes. '
   +'Réversible à tout moment depuis ton historique.</span></label>';
  body.innerHTML=h;

  body.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.c;
    delete resDraft.cards[i];
    pickCards(2,'Cartes de '+order[i],cs=>{ resDraft.cards[i]=cs; render(); });
  });
  bind('r-win',v=>{
    const i=+v, k=resDraft.winners.indexOf(i);
    if(k>=0) resDraft.winners.splice(k,1); else resDraft.winners.push(i);
    render();
  });
  // Le bouton doit suivre la saisie en direct : re-rendre ferait perdre le focus
  // du champ, donc on synchronise l'état disabled à chaque frappe.
  const syncPub=()=>{ const b=$('pub'); if(b) b.disabled=!resDraft.winners.length; };
  $('q').oninput=e=>{ resDraft.q=e.target.value; syncPub(); };
  $('r-priv').onchange=e=>{ resDraft.priv=e.target.checked; };
  foot.style.display='block';
  foot.innerHTML='<div class="acts"><button class="act cy" id="pub">'
   +(LIVE&&!DB.me?'SE CONNECTER POUR PUBLIER':'PUBLIER LA MAIN')+'</button></div>';
  $('pub').onclick=()=>{ if(!$('pub').disabled) publish(); };
  syncPub();
}
async function publish(){
  if(LIVE&&!DB.me){ go('auth'); return; }
  const inv=round2(S.seats[S.cfg.heroSeat].total);
  const alive=S.seats.map((p,i)=>p.active?i:-1).filter(i=>i>=0);
  resDraft.winners=resDraft.winners.filter(i=>alive.includes(i));
  if(!resDraft.winners.length){ render(); return; }
  const won=resDraft.winners.includes(S.cfg.heroSeat);
  const h={id:'u'+Date.now(),author:DB.me,cfg:S.cfg,board:S.board.slice(),actions:S.actions,
    potFinal:S.potClosed,endReason:S.endReason,invested:inv,won,alive,
    winners:resDraft.winners.slice(),
    showdown:Object.keys(resDraft.cards).length?Object.assign({},resDraft.cards):null,
    result:round2(won?S.potClosed/resDraft.winners.length-inv:-inv),
    question:(resDraft.q.trim()||autoTitle(S.cfg,S.actions,S.board)).slice(0,140),
    private:resDraft.priv,
    createdAt:Date.now(),likes:0,dislikes:0,comments:[],
    tags:autoTags(S.cfg,S.actions,S.board)};
  if(LIVE){
    // la main est écrite en base AVANT d'être affichée : si l'écriture échoue,
    // on le dit au lieu de laisser croire que c'est publié
    const payload={cfg:h.cfg,board:h.board,actions:h.actions,showdown:h.showdown,
      winners:h.winners,alive:h.alive};
    const r=await sb.from('hands').insert({author_id:DB.me,question:h.question,payload,
      pot_final:h.potFinal,invested:h.invested,result:h.result,won:h.won,
      end_reason:h.endReason,tags:h.tags,is_private:h.private}).select('id,created_at').single();
    if(r.error){
      const b=$('pub'); if(b){ b.textContent='ÉCHEC — RÉESSAYER'; b.disabled=false;
        let e=$('puberr');
        if(!e){ e=document.createElement('div'); e.id='puberr'; e.className='msg err';
          e.style.marginTop='8px'; b.parentNode.appendChild(e); }
        e.textContent='Base : '+r.error.message
          +(/is_private|column/i.test(r.error.message)
            ?' — re-exécute supabase-schema.sql dans le SQL Editor.':'');
      }
      console.error(r.error); return;
    }
    h.id=r.data.id; h.createdAt=Date.parse(r.data.created_at);
  }
  DB.hands.push(h);
  S=null; resDraft={winners:[],cards:{},q:'',priv:false}; stopClock(); hist=[];
  store.del('draft');
  if(captureMemo){ captures=captures.filter(c=>c.id!==captureMemo.id);
    store.set('captures',captures); captureMemo=null; }
  persistDemo();
  stack=[{v:'profile'}]; route={v:'hand',id:h.id}; render();
}

restoreLocal();
applyTheme(store.get('theme')
  || (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
parseHash();
render();
</script>
</body>
